<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Health Dashboard</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --white: #ffffff;
      --text: #1e2a3a;
      --text-dim: #6b7a8d;
      --border: #e2e6ec;
      --accent: #0ea5a0;
      --green: #0ea570;
      --green-bg: #e6f7ef;
      --orange: #e07a2f;
      --orange-bg: #fdf0e4;
      --teal: #0ea5a0;
      --teal-bg: #e0f5f4;
      --red: #d94052;
      --red-bg: #fde8eb;
      --gray: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 32px 48px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 28px;
      padding-top: 20px;
      background: var(--white);
      padding-left: 32px;
      padding-right: 32px;
    }
    .tab {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
      user-select: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* KPI Row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    .kpi-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 26px;
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .kpi-value {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1.5px;
      color: var(--text);
    }

    /* Funnel Banner */
    .funnel-banner {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 14px 22px;
      margin-bottom: 32px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .funnel-banner strong { color: var(--text); font-weight: 600; }
    .funnel-banner .gate { color: var(--red); font-weight: 700; }
    .funnel-arrow { color: var(--gray); margin: 0 4px; }

    /* Section */
    .section { margin-bottom: 32px; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      padding-left: 4px;
    }
    .section-bar {
      width: 4px;
      height: 20px;
      border-radius: 2px;
      background: var(--accent);
    }
    .section-title { font-size: 16px; font-weight: 700; }
    .section-count { font-size: 14px; color: var(--text-dim); }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }
    .data-table thead th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      background: #fafbfc;
      white-space: nowrap;
    }
    .data-table thead th.num { text-align: center; }
    .data-table tbody tr { transition: background 0.1s; }
    .data-table tbody tr:hover { background: #f8f9fb; }
    .data-table tbody tr:not(:last-child) td { border-bottom: 1px solid #f0f2f5; }
    .data-table tbody td {
      padding: 14px 16px;
      font-size: 14px;
      vertical-align: middle;
    }
    .data-table tbody td.num {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .data-table tbody td.role-cell { font-weight: 600; max-width: 240px; }
    .data-table tbody td.dept-cell { color: var(--text-dim); }
    .data-table tbody td.age-cell { font-variant-numeric: tabular-nums; }
    .data-table tbody td.recruiter-cell { color: var(--text-dim); font-size: 13px; }
    .data-table tbody td.hires-cell { font-weight: 700; font-variant-numeric: tabular-nums; }

    /* Health Badges */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .badge.on_track  { background: var(--green-bg); color: var(--green); }
    .badge.secured   { background: var(--teal-bg);  color: var(--teal); }
    .badge.covered   { background: var(--teal-bg);  color: var(--teal); }
    .badge.at_risk   { background: var(--orange-bg); color: var(--orange); }
    .badge.empty     { background: #f1f5f9;         color: var(--gray); }
    .badge.healthy   { background: var(--green-bg); color: var(--green); }
    .badge.unhealthy { background: var(--red-bg);   color: var(--red); }

    .highlight-post { color: var(--accent); font-weight: 700 !important; }
    .highlight-cultural { color: #d97706; font-weight: 700 !important; }
    .highlight-offer { color: var(--green); font-weight: 700 !important; }
    .zero { color: #c5cdd8; }

    /* SLA Badges */
    .sla-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .pos-multi {
      color: var(--accent) !important;
      font-weight: 700 !important;
    }
    .sla-badge.overdue { background: var(--red); color: #fff; }
    .sla-badge.warning { background: var(--orange); color: #fff; }
    .sla-badge.filling { background: var(--green); color: #fff; }

    /* Empty section */
    .empty-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .empty-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .empty-card .name { font-size: 14px; font-weight: 600; }
    .empty-card .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .empty-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #e2e6ec;
    }

    /* Collapsible sections */
    .collapsible-header {
      cursor: pointer;
      user-select: none;
    }
    .collapsible-header::before {
      content: '▼';
      display: inline-block;
      font-size: 10px;
      margin-right: 8px;
      transition: transform 0.2s;
      color: var(--text-dim);
    }
    .collapsible-header.collapsed::before {
      transform: rotate(-90deg);
    }
    .collapsible-body {
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .collapsible-body.collapsed {
      max-height: 0 !important;
      overflow: hidden;
    }

    /* Issue type badges */
    .issue-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .issue-badge.quality      { background: #fef3c7; color: #92400e; }
    .issue-badge.calibration  { background: #ede9fe; color: #5b21b6; }
    .issue-badge.risk         { background: var(--red-bg); color: var(--red); }
    .issue-badge.sustainability { background: var(--orange-bg); color: var(--orange); }
    .issue-badge.stakeholder  { background: #dbeafe; color: #1e40af; }

    /* Red-flagged row */
    .row-flagged td { background: #fff5f5 !important; }

    /* Tab content containers */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Passthrough rate cards */
    .passthrough-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    .passthrough-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 18px 22px;
      text-align: center;
    }
    .passthrough-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .passthrough-value {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--accent);
    }

    @media (max-width: 1000px) {
      .kpi-row { grid-template-columns: 1fr; }
      .passthrough-row { grid-template-columns: repeat(2, 1fr); }
      .data-table { font-size: 12px; }
    }
  </style>
</head>

        'Offer</div>';

      /* ---- Top 5 Risks: roles most likely to miss SLA (evergreens excluded — always open) ---- */
      var riskScored = jobs.filter(function(j){ return !j.evergreen && j.section !== 'offer' && j.sla_status !== 'filling'; }).map(function(j){
        // Risk score: combines SLA breach magnitude, pipeline thinness, and absence of late-stage candidates
        var slaPenalty = 0;
        if (j.sla_status === 'overdue') slaPenalty = 100 + Math.abs(j.sla_remaining || 0) * 2;

    /* ================================================================

    function renderRecruiter() {

      var STALE_THRESHOLD = (TA_INSIGHTS && TA_INSIGHTS.stale_threshold) ? TA_INSIGHTS.stale_threshold : 5;

        if (avg === null || avg === undefined) return '#f1f5f9';

      }
      slaRefHtml += slaPairs.join(' &middot; ') + '. ' +
        '<strong>Stale flag:</strong> ' + STALE_THRESHOLD + 'd untouched. ' +

        '<strong>Notes:</strong> updated same day as candidate interaction (per §6.1).' +

      html += slaRefHtml;

      /* ---- Per-TA League Cards (KPI overview) ---- */
      var leagueHtml = '<div class="kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">';
      for (var li = 0; li < taWhitelist.length; li++) {

        var ins = taIns[tn] || {};
        var rd = rec[tn] || {};
        var first = tn.charAt(0); // first initial per Valerie 2026-05-26
        var staleCt = ins.stale_count || 0;

        leagueHtml += '<div class="kpi-card" style="border-left:4px solid ' + border + ';padding:16px 20px">' +

          '<div class="kpi-label" style="font-size:14px;font-weight:700;color:var(--text);text-transform:none">' + escHtml(first) + '</div>' +
          '<span style="font-size:11px;color:var(--text-dim)">' + openRoles + ' roles &middot; ' + pipelineCt + ' cands</span>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px">' +
          '<div><span style="color:var(--text-dim)">Stale &gt;' + STALE_THRESHOLD + 'd</span><br><strong style="font-size:18px;color:' + (staleCt>0?'var(--red)':'var(--green)') + '">' + staleCt + '</strong></div>' +
          '<div><span style="color:var(--text-dim)">SLA breaches</span><br><strong style="font-size:18px;color:' + (breachPct>30?'var(--red)':breachPct>15?'var(--orange)':'var(--green)') + '">' + breachPct + '%</strong></div>' +
          '<div><span style="color:var(--text-dim)">App Review wait</span><br><strong style="color:' + (arWait>5?'var(--red)':arWait>3?'var(--orange)':'var(--green)') + '">' + arWaitDisplay + '</strong></div>' +
          '<div><span style="color:var(--text-dim)">Bottleneck</span><br><strong style="font-size:13px">' + bottleneck + '</strong></div>' +
          '</div>' +
          '</div>';
      }
      leagueHtml += '</div>';
      html += leagueHtml;

      /* ---- 🚨 Stale Candidates Hot List (>5d untouched) ---- */
      var allStale = [];
      for (var sti = 0; sti < taWhitelist.length; sti++) {
        var stn = taWhitelist[sti];
        var stIns = taIns[stn] || {};
        var stArr = stIns.stale_candidates || [];
        for (var ssi = 0; ssi < stArr.length; ssi++) {
          var c = stArr[ssi];
          allStale.push({ta: stn, role: c.role, stage: c.stage, days_idle: c.days_idle, last_activity_at: c.last_activity_at, app_id: c.app_id, breach: c.breach});

          staleHtml += '<tr' + (s.days_idle > 14 ? ' class="row-flagged"' : '') + '>' +
            '<td>' + escHtml(s.ta.charAt(0)) + '</td>' +
            '<td class="role-cell">' + escHtml(s.role) + '</td>' +

      var worstPerStage = {};
      for (var wsi = 0; wsi < ptStageNames.length; wsi++) worstPerStage[ptStageNames[wsi]] = {dept:null, pct:999};
      for (var wpi = 0; wpi < names.length; wpi++) {
        var wpN = names[wpi]; var wpP = dept[wpN].per_stage;
        var ptChecks = [
          {key:'earlyToScreened', from:wpP.early, to:wpP.screened},
          {key:'screenedToTF', from:wpP.screened, to:wpP.team_fit},
          {key:'tfToTech', from:wpP.team_fit, to:wpP.technical},
          {key:'techToCultural', from:wpP.technical, to:wpP.cultural},
          {key:'tfToCultural', from:wpP.team_fit, to:wpP.cultural},
          {key:'culturalToOffer', from:wpP.cultural, to:wpP.offer}
        ];
        for (var wci = 0; wci < ptChecks.length; wci++) {
          var wc = ptChecks[wci];
          if (wc.from > 2) {
            var wcPct = Math.round((wc.to / wc.from) * 100);
            if (wcPct < worstPerStage[wc.key].pct) { worstPerStage[wc.key] = {dept:wpN, pct:wcPct}; }
          }
        }
      }

      var deptPtHtml = '<table class="data-table"><thead><tr>' +
        '<th>Department</th>' +
        '<th class="num">Early &rarr; Screened</th>' +
        '<th class="num">Screened &rarr; Team Fit</th>' +
        '<th class="num">Team Fit &rarr; Technical</th>' +
        '<th class="num">Technical &rarr; Cultural</th>' +
        '<th class="num">Team Fit &rarr; Cultural</th>' +
        '<th class="num">Cultural &rarr; Offer</th>' +
        '</tr></thead><tbody>';

      var histPT = ANALYTICS.dept_historical_passthrough || {};
      for (var pi = 0; pi < names.length; pi++) {
        var pn = names[pi];
        var hp = histPT[pn] || {ta_screening:0, team_fit:0, technical:0, cultural:0};
        var pp = dept[pn].per_stage;
        function ptRateH(from, to) {
          if (from === 0) return '\u2014';
          var pct = Math.round((to / from) * 100);
          if (pct > 100) pct = 100;
          var bad = pct < 15 && from > 5;
          return '<span' + (bad ? ' style="color:var(--red);font-weight:700"' : '') + '>' + pct + '%</span>';
        }
        var tfToCult = (hp.team_fit > 0) ? Math.min(100, Math.round((hp.cultural / hp.team_fit) * 100)) : 0;
        var techToCult = (hp.technical > 0) ? Math.min(100, Math.round((hp.cultural / hp.technical) * 100)) : 0;
        var techBad = hp.technical > 2 && techToCult < 20;
        var rowCls = techBad ? ' class="row-flagged"' : '';
        deptPtHtml += '<tr' + rowCls + '>' +
          '<td class="role-cell">' + escHtml(pn) + '</td>' +
          '<td class="num">' + ptRateH(pp.early, hp.ta_screening) + '</td>' +
          '<td class="num">' + ptRateH(hp.ta_screening, hp.team_fit) + '</td>' +
          '<td class="num">' + ptRateH(hp.team_fit, hp.technical) + '</td>' +
          '<td class="num"><span' + (techBad ? ' style="color:var(--red);font-weight:700"' : '') + '>' + (hp.technical > 0 ? techToCult + '%' : '\u2014') + '</span></td>' +
          '<td class="num"><span' + (hp.team_fit > 3 && tfToCult < 15 ? ' style="color:var(--orange);font-weight:700"' : '') + '>' + (hp.team_fit > 0 ? tfToCult + '%' : '\u2014') + '</span></td>' +
          '<td class="num">' + ptRateH(hp.cultural, pp.offer) + '</td>' +
          '</tr>';
      }
      deptPtHtml += '</tbody></table>';
      html += collapsibleSection('Department Passthrough Rates', '(% of candidates advancing to next stage)', 'var(--red)', deptPtHtml);

      /* Per-Manager Hireflix Review Time */
      var mgrHF = ANALYTICS.manager_hireflix_review || [];
      if (mgrHF.length > 0) {
        var mgrTableHtml = '<table class="data-table"><thead><tr>' +
          '<th>Hiring Manager</th><th class="num">Candidates</th><th class="num">Avg Review (days)</th>' +
          '<th class="num">Delays (5d+)</th><th class="num">Severe (10d+)</th><th>Roles</th>' +
          '</tr></thead><tbody>';
        for (var mi = 0; mi < mgrHF.length; mi++) {
          var mg = mgrHF[mi];
          var flagged = mg.delays > 0;
          var rowCls = flagged ? ' class="row-flagged"' : '';
          var rolesStr = mg.roles.map(function(r) {
            var bad = r.max_days > 10;
            return '<span style="font-size:11px' + (bad ? ';color:var(--red);font-weight:700' : '') + '">' + escHtml(r.name) + ' (' + r.avg_days + 'd, max ' + r.max_days + 'd)</span>';
          }).join(', ');
          mgrTableHtml += '<tr' + rowCls + '>' +
            '<td class="role-cell">' + escHtml(mg.manager) + '</td>' +
            '<td class="num">' + mg.total_candidates + '</td>' +
            '<td class="num"' + (mg.avg_days > 5 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + mg.avg_days + 'd</td>' +
            '<td class="num"' + (mg.delays > 0 ? ' style="color:var(--orange);font-weight:700"' : '') + '>' + mg.delays + '</td>' +
            '<td class="num"' + (mg.severe > 0 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + mg.severe + '</td>' +
            '<td style="font-size:12px">' + rolesStr + '</td>' +
            '</tr>';
        }
        mgrTableHtml += '</tbody></table>';
        html += collapsibleSection('Manager Hireflix Review Time', '(' + mgrHF.length + ' managers)', 'var(--orange)', mgrTableHtml);
      }

      /* Manager Delay → SLA Correlation */
      var mgrCorr = ANALYTICS.manager_sla_correlation || [];
      var corrWithImpact = mgrCorr.filter(function(c){ return c.delay_candidates > 0 || c.roles_overdue > 0; });
      if (corrWithImpact.length > 0) {
        var corrHtml = '<div class="funnel-banner" style="margin-bottom:16px">' +
          '<strong>Correlation:</strong> Managers with slow review times (5d+) tend to cause pipeline delays. ' +
          'Roles with manager delays are more likely to breach SLA targets.</div>' +
          '<table class="data-table"><thead><tr>' +
          '<th>Manager</th><th class="num">Roles</th><th class="num">Avg Review</th>' +
          '<th class="num">Delayed Cands</th><th class="num">Severe</th>' +
          '<th>Impact</th><th>Affected Roles</th>' +
          '</tr></thead><tbody>';
        for (var ci = 0; ci < corrWithImpact.length; ci++) {
          var cr = corrWithImpact[ci];
          var impactBadge = cr.correlation === 'strong' ? '<span class="issue-badge risk">Strong</span>' :
            cr.correlation === 'moderate' ? '<span class="issue-badge calibration">Moderate</span>' : '';
          var affectedStr = cr.roles.filter(function(r){return r.avg_wait > 5}).map(function(r){
            return '<span style="font-size:11px">' + escHtml(r.role) + ' (' + r.avg_wait + 'd)</span>';
          }).join(', ');
          var rowCls = cr.correlation === 'strong' ? ' class="row-flagged"' : '';
          corrHtml += '<tr' + rowCls + '>' +
            '<td class="role-cell">' + escHtml(cr.manager) + '</td>' +
            '<td class="num">' + cr.roles_count + '</td>' +
            '<td class="num"' + (cr.avg_review_days > 5 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + cr.avg_review_days + 'd</td>' +
            '<td class="num"' + (cr.delay_candidates > 5 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + cr.delay_candidates + '</td>' +
            '<td class="num">' + cr.severe_delays + '</td>' +
            '<td>' + impactBadge + '</td>' +
            '<td style="font-size:12px">' + (affectedStr || '\u2014') + '</td>' +
            '</tr>';
        }
        corrHtml += '</tbody></table>';
        html += collapsibleSection('Manager Delay → SLA Impact', '(' + corrWithImpact.length + ' managers with delays)', 'var(--red)', corrHtml);
      }

      document.getElementById('tab-department').innerHTML = html;
    }

    /* ================================================================
       TAB: HIRING PERFORMANCE
       ================================================================ */
    function renderPerformance() {
      var pt = ANALYTICS.passthrough_rates;

      /* Top 5 Risks: roles most likely to fail SLA */
      var riskCandidates = [];
      var perfMgrDelays = ANALYTICS.manager_delays || {};
      var perfRoleHealth = ANALYTICS.per_role_health || [];
      for (var rci = 0; rci < jobs.length; rci++) {
        var rj = jobs[rci];
        var riskScore = 0;
        var reasons = [];
        // Thin pipeline
        if (rj.total > 0 && rj.technical === 0 && rj.cultural === 0 && rj.offer === 0) {
          riskScore += 3;
          if (rj.pre_gate < 3) reasons.push('Thin pipeline: ' + rj.pre_gate + ' at Team Fit, none past');
          else reasons.push('No candidates past Team Fit');
        }
        // SLA overdue
        if (rj.sla_status === 'overdue') { riskScore += 4; reasons.push(Math.abs(rj.sla_remaining) + 'd over SLA'); }
        else if (rj.sla_status === 'warning') { riskScore += 2; reasons.push('Only ' + rj.sla_remaining + 'd until SLA'); }
        // Manager delays
        var rjDelay = perfMgrDelays[rj.name];
        if (rjDelay && (rjDelay.hireflix_severe > 0 || rjDelay.tech_severe > 0)) {
          riskScore += 2;
          if (rjDelay.hireflix_severe > 0) reasons.push('HM Hireflix delay (max ' + rjDelay.max_hireflix + 'd)');
          if (rjDelay.tech_severe > 0) reasons.push('Tech scheduling delay (max ' + rjDelay.max_tech + 'd)');
        }
        // Health issues from analytics
        var roleH = perfRoleHealth.filter(function(rh){ return rh.name === rj.name; })[0];
        if (roleH && !roleH.healthy) {
          riskScore += 1;
          if (roleH.issue === 'calibration') reasons.push('Calibration issue');
          else if (roleH.issue === 'stakeholder') reasons.push('HM bottleneck');
        }
        // High age
        if (rj.age_days > 90) { riskScore += 1; reasons.push('Pipeline age: ' + rj.age_days + 'd'); }
        if (riskScore > 0) riskCandidates.push({name:rj.name, dept:rj.dept, recruiter:rj.recruiter||'\u2014', score:riskScore, reasons:reasons});
      }
      riskCandidates.sort(function(a,b){ return b.score - a.score; });
      var top5 = riskCandidates.slice(0, 5);

      var riskHtml = '<div class="kpi-row" style="grid-template-columns:1fr;margin-bottom:24px">';
      for (var t5i = 0; t5i < top5.length; t5i++) {
        var t5 = top5[t5i];
        var riskColor = t5.score >= 5 ? 'var(--red)' : t5.score >= 3 ? 'var(--orange)' : 'var(--text-dim)';
        riskHtml += '<div class="kpi-card" style="border-left:4px solid ' + riskColor + ';padding:12px 18px;display:flex;align-items:center;gap:16px">' +
          '<div style="min-width:24px;text-align:center;font-size:18px;font-weight:700;color:' + riskColor + '">' + (t5i + 1) + '</div>' +
          '<div style="flex:1">' +
          '<div style="font-weight:700;font-size:14px">' + escHtml(t5.name) + ' <span style="font-size:12px;color:var(--text-dim);font-weight:500">' + escHtml(t5.dept) + ' \u00b7 ' + escHtml(t5.recruiter) + '</span></div>' +
          '<div style="font-size:12px;color:var(--text-dim);margin-top:2px">' + t5.reasons.join(' \u00b7 ') + '</div>' +
          '</div></div>';
      }
      riskHtml += '</div>';

      var html = collapsibleSection('Top 5 Risks', '(roles most likely to fail SLA)', 'var(--red)', riskHtml);

      var ptCardsHtml = '<div class="passthrough-row">' +
        '<div class="passthrough-card"><div class="passthrough-label">Screening &rarr; Team Fit</div><div class="passthrough-value">' + pt.screening_to_teamfit + '%</div></div>' +
        '<div class="passthrough-card"><div class="passthrough-label">Team Fit &rarr; Technical</div><div class="passthrough-value">' + pt.teamfit_to_technical + '%</div></div>' +
        '<div class="passthrough-card" style="border-left-color:var(--red)"><div class="passthrough-label">Technical &rarr; Cultural</div><div class="passthrough-value" style="color:var(--red)">' + pt.technical_to_cultural + '%</div></div>' +
        '<div class="passthrough-card" style="border-left-color:var(--orange)"><div class="passthrough-label">Team Fit &rarr; Cultural</div><div class="passthrough-value" style="color:var(--orange)">' + (pt.teamfit_to_cultural || 0) + '%</div><div style="font-size:10px;color:var(--text-dim)">compound</div></div>' +
        '<div class="passthrough-card"><div class="passthrough-label">Cultural &rarr; Offer</div><div class="passthrough-value">' + pt.cultural_to_offer + '%</div></div>' +
        '</div>';
      html += collapsibleSection('Passthrough Rates', '', 'var(--accent)', ptCardsHtml);

      var roles = ANALYTICS.per_role_health.slice();
      roles.sort(function(a,b) { if (a.healthy === b.healthy) return 0; return a.healthy ? 1 : -1; });
      var unhealthyCount = roles.filter(function(r){ return !r.healthy; }).length;
      var healthyCount = roles.length - unhealthyCount;

      var roleHealthHtml = '<table class="data-table"><thead><tr>' +
        '<th>Role</th><th>Department</th><th>Recruiter</th><th>Health</th><th>Issue Type</th><th>Reason</th>' +
        '</tr></thead><tbody>';

      for (var ri = 0; ri < roles.length; ri++) {
        var r = roles[ri];
        var healthBadge = r.healthy
          ? '<span class="badge healthy">Healthy</span>'
          : '<span class="badge unhealthy">Unhealthy</span>';
        var issueBadge = '';
        if (r.issue) issueBadge = '<span class="issue-badge ' + r.issue + '">' + r.issue + '</span>';
        var rowCls = r.healthy ? '' : ' class="row-flagged"';
        roleHealthHtml += '<tr' + rowCls + '>' +
          '<td class="role-cell">' + escHtml(r.name) + '</td>' +
          '<td class="dept-cell">' + escHtml(r.dept) + '</td>' +
          '<td class="recruiter-cell">' + escHtml(r.recruiter) + '</td>' +
          '<td>' + healthBadge + '</td>' +
          '<td>' + issueBadge + '</td>' +
          '<td style="font-size:13px;color:var(--text-dim);max-width:340px">' + (r.reason ? escHtml(r.reason) : '\u2014') + '</td>' +
          '</tr>';
      }
      roleHealthHtml += '</tbody></table>';
      html += collapsibleSection('Role Health Diagnosis', '(' + unhealthyCount + ' issues, ' + healthyCount + ' healthy)', 'var(--red)', roleHealthHtml);

      /* Stage Timing per Role */
      var roleTiming = ANALYTICS.role_timing || [];
      if (roleTiming.length > 0) {
        var stageTimingHtml = '<table class="data-table"><thead><tr>' +
          '<th>Role</th><th>Recruiter</th>' +
          '<th class="num">Screening</th>' +
          '<th class="num">Hireflix</th>' +
          '<th class="num">Team Fit</th>' +
          '<th class="num">Technical</th>' +
          '<th class="num">Overdue App</th>' +
          '<th class="num">Overdue Screen</th>' +
          '<th>Bottleneck</th>' +
          '</tr></thead><tbody>';

        for (var ti = 0; ti < roleTiming.length; ti++) {
          var rt = roleTiming[ti];
          var hasOverdue = rt.overdue_application > 0 || rt.overdue_screening > 0;
          var rowCls = hasOverdue ? ' class="row-flagged"' : '';
          function daysCell(avg, count, threshold) {
            if (count === 0) return '<td class="num zero">\u2014</td>';
            var bad = avg > threshold;
            return '<td class="num"' + (bad ? ' style="color:var(--red);font-weight:700"' : '') + '>' + avg + 'd <span style="font-size:10px;color:var(--text-dim)">(' + count + ')</span></td>';
          }
          // Determine bottleneck
          var bneck = '';
          if (rt.avg_hireflix > 10 && rt.count_hireflix > 0) bneck = 'HM slow on Hireflix (' + rt.avg_hireflix + 'd)';
          else if (rt.avg_screening > 15 && rt.count_screening > 2) bneck = 'Screening backlog (' + rt.avg_screening + 'd)';
          else if (rt.avg_technical > 12 && rt.count_technical > 0) bneck = 'Technical delay (' + rt.avg_technical + 'd)';
          else if (rt.avg_team_fit > 8 && rt.count_team_fit > 0) bneck = 'Team Fit slow (' + rt.avg_team_fit + 'd)';
          else if (rt.overdue_screening > 5) bneck = rt.overdue_screening + ' stuck in screening';
          else if (rt.overdue_application > 20) bneck = rt.overdue_application + ' unreviewed apps';
          // Check from jobs data if no candidates past screening
          var bnJob = jobs.filter(function(j){ return j.name === rt.name; })[0];
          if (!bneck && bnJob && bnJob.technical === 0 && bnJob.cultural === 0 && bnJob.offer === 0 && bnJob.pre_gate > 0) {
            bneck = 'No candidates past Team Fit';
          }
          stageTimingHtml += '<tr' + rowCls + '>' +
            '<td class="role-cell">' + escHtml(rt.name) + '</td>' +
            '<td class="recruiter-cell">' + escHtml(rt.recruiter) + '</td>' +
            daysCell(rt.avg_screening, rt.count_screening, 7) +
            daysCell(rt.avg_hireflix, rt.count_hireflix, 5) +
            daysCell(rt.avg_team_fit, rt.count_team_fit, 5) +
            daysCell(rt.avg_technical, rt.count_technical, 10) +
            '<td class="num"' + (rt.overdue_application > 0 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + rt.overdue_application + '</td>' +
            '<td class="num"' + (rt.overdue_screening > 0 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + rt.overdue_screening + '</td>' +
            '<td style="font-size:12px;color:' + (bneck ? 'var(--red)' : 'var(--green)') + ';font-weight:600">' + (bneck || 'OK') + '</td>' +
            '</tr>';
        }
        stageTimingHtml += '</tbody></table>';
        html += collapsibleSection('Average Days in Stage per Role', '(flag: >7d in application/screening)', 'var(--orange)', stageTimingHtml);
      }

      /* Monthly Tracker */
      var monthlyFills = ANALYTICS.monthly_fills || {};
      var monthlyFillsByTA = ANALYTICS.monthly_fills_by_ta || {};
      var monthlyScreensByTA = ANALYTICS.monthly_screens_by_ta || {};
      var allMonths = ANALYTICS.all_months || [];

      var months2026 = allMonths.filter(function(m){return m.startsWith('2026')});
      if (months2026.length > 0) {
        var TA_WHITELIST = ['W1','W3','W2','W4'];
        var activeTAs = TA_WHITELIST.filter(function(ta){ return monthlyFillsByTA[ta] || monthlyScreensByTA[ta]; });

        var monthlyTrackerHtml = '<table class="data-table"><thead><tr>' +
          '<th>Month</th><th class="num">Fills</th>';
        for (var tai = 0; tai < activeTAs.length; tai++) {
          var firstName = activeTAs[tai].split(' ')[0];
          monthlyTrackerHtml += '<th class="num">' + escHtml(firstName) + ' Fills</th><th class="num">' + escHtml(firstName) + ' Screens</th>';
        }
        monthlyTrackerHtml += '</tr></thead><tbody>';

        var totalFillsAll = 0;
        for (var mi = 0; mi < months2026.length; mi++) {
          var m = months2026[mi];
          var fills = monthlyFills[m] || 0;
          totalFillsAll += fills;
          monthlyTrackerHtml += '<tr>' +
            '<td class="role-cell">' + m + '</td>' +
            '<td class="num" style="font-weight:700">' + fills + '</td>';
          for (var tbi = 0; tbi < activeTAs.length; tbi++) {
            var ta = activeTAs[tbi];
            var taFills = (monthlyFillsByTA[ta] || {})[m] || 0;
            var taScreens = (monthlyScreensByTA[ta] || {})[m] || 0;
            monthlyTrackerHtml += numCell(taFills, taFills > 0 ? 'highlight-offer' : '') +
              numCell(taScreens, taScreens > 20 ? 'highlight-post' : '');
          }
          monthlyTrackerHtml += '</tr>';
        }

        monthlyTrackerHtml += '<tr style="font-weight:700;border-top:2px solid var(--border)">' +
          '<td class="role-cell">Total</td>' +
          '<td class="num">' + totalFillsAll + '</td>';
        for (var tci = 0; tci < activeTAs.length; tci++) {
          var taName = activeTAs[tci];
          var totalTAFills = Object.values(monthlyFillsByTA[taName] || {}).reduce(function(s,v){return s+v},0);
          var totalTAScreens = Object.values(monthlyScreensByTA[taName] || {}).reduce(function(s,v){return s+v},0);
          monthlyTrackerHtml += '<td class="num highlight-offer">' + totalTAFills + '</td><td class="num highlight-post">' + totalTAScreens + '</td>';
        }
        monthlyTrackerHtml += '</tr>';

        /* Screens-to-Hire Ratio row */
        var totalScreensAll2026 = 0;
        for (var sr2i = 0; sr2i < activeTAs.length; sr2i++) {
          var sr2ta = activeTAs[sr2i];
          months2026.forEach(function(m2){ totalScreensAll2026 += ((monthlyScreensByTA[sr2ta] || {})[m2] || 0); });
        }
        var overallSHR = totalFillsAll > 0 ? (totalScreensAll2026 / totalFillsAll).toFixed(1) : '\u2014';
        monthlyTrackerHtml += '<tr style="background:#f8f9fb;font-weight:600">' +
          '<td class="role-cell" style="color:var(--accent)">Screens / Hire</td>' +
          '<td class="num" style="color:var(--accent)">' + overallSHR + '</td>';
        for (var shri = 0; shri < activeTAs.length; shri++) {
          var shrTA = activeTAs[shri];
          var shrFills = 0; var shrScreens = 0;
          months2026.forEach(function(m2){
            shrFills += ((monthlyFillsByTA[shrTA] || {})[m2] || 0);
            shrScreens += ((monthlyScreensByTA[shrTA] || {})[m2] || 0);
          });
          var shrRatio = shrFills > 0 ? (shrScreens / shrFills).toFixed(1) : '\u2014';
          var shrColor = shrFills > 0 && (shrScreens / shrFills) > 30 ? 'var(--red)' : 'var(--accent)';
          monthlyTrackerHtml += '<td class="num" style="color:' + shrColor + '">' + shrRatio + '</td><td class="num">\u2014</td>';
        }
        monthlyTrackerHtml += '</tr></tbody></table>';
        html += collapsibleSection('Monthly Hiring Tracker (2026)', '', 'var(--accent)', monthlyTrackerHtml);

        /* YoY comparison moved to Pipeline Health tab */
      }

      document.getElementById('tab-performance').innerHTML = html;
    }

    /* ================================================================
       TAB: EFFECTIVENESS
       ================================================================ */
    function renderEffectiveness() {
      /* Key Insights banner - auto-generated from data */
      var effInsights = [];
      // Insight 1: Overall passthrough bottleneck
      var effPt = ANALYTICS.passthrough_rates;
      effInsights.push('Technical interview is the critical bottleneck: only ' + effPt.technical_to_cultural + '% pass through (compound Team Fit\u2192Cultural: ' + (effPt.teamfit_to_cultural || 0) + '%)');
      // Insight 2: Highest rejection stage
      var effRej = ANALYTICS.rejection_by_stage_excl_intern || {};
      var topRejStage = ''; var topRejCount = 0;
      for (var ers in effRej) {
        if (ers !== 'Application Review' && ers !== 'Unknown' && effRej[ers] > topRejCount) { topRejCount = effRej[ers]; topRejStage = ers; }
      }
      if (topRejStage) effInsights.push('Highest post-app rejection stage: ' + topRejStage + ' with ' + topRejCount.toLocaleString() + ' rejections (excl. intern)');
      // Insight 3: Manager delays impact
      var effMgrHF = ANALYTICS.manager_hireflix_review || [];
      var totalMgrDelays2 = effMgrHF.reduce(function(s,m){ return s + m.delays; }, 0);
      var totalMgrSevere = effMgrHF.reduce(function(s,m){ return s + m.severe; }, 0);
      if (totalMgrDelays2 > 0) effInsights.push(totalMgrDelays2 + ' manager Hireflix delays (' + totalMgrSevere + ' severe 10d+) are slowing pipeline across ' + effMgrHF.filter(function(m){return m.delays > 0}).length + ' managers');
      // Insight 4: TA with best/worst efficiency
      var effFunnel = ANALYTICS.funnel_efficiency || [];
      var calibRoles = effFunnel.filter(function(f){ return f.tf_to_tech_pct < 30 && f.team_fit_entered > 3; });
      if (calibRoles.length > 0) effInsights.push(calibRoles.length + ' roles show HM calibration issues (TF\u2192Tech <30%): ' + calibRoles.slice(0,3).map(function(r){return r.name}).join(', '));
      // Insight 5: offer decline rate
      var effOD = ANALYTICS.offer_decline_2026 || {};
      if (effOD.decline_rate > 10) effInsights.push('Offer decline rate at ' + effOD.decline_rate + '% (' + effOD.declined + ' of ' + effOD.total + ') \u2014 review comp/candidate experience');

      var insightBanner = '<div class="funnel-banner" style="border-left-color:var(--accent);margin-bottom:24px">' +
        '<strong style="font-size:13px">KEY INSIGHTS</strong>';
      for (var eii = 0; eii < effInsights.length; eii++) {
        insightBanner += '<div style="font-size:13px;margin-top:6px;padding-left:12px">' + (eii + 1) + '. ' + effInsights[eii] + '</div>';
      }
      insightBanner += '</div>';

      function normalizeRejections(raw) {
        var mapped = { 'TA Screening': 0, 'Team Fit': 0, 'Technical': 0, 'Cultural': 0, 'Offer': 0, 'Other': 0 };
        for (var stage in raw) {
          var count = raw[stage];
          var s = stage.toLowerCase().trim();
          if (s === 'ta screening' || s === 'ta first review' || s === 'hm screening' || s === 'hiring manager screening') mapped['TA Screening'] += count;
          else if (s === 'team fit' || s === 'meeting joeri - team fit') mapped['Team Fit'] += count;
          else if (s === 'technical' || s === 'technical case study & interview') mapped['Technical'] += count;
          else if (s === 'cultural' || s === 'cultural interview' || s === 'automated reference with zinc') mapped['Cultural'] += count;
          else if (s === 'offer') mapped['Offer'] += count;
          else if (s !== 'application review' && s !== 'unknown') mapped['Other'] += count;
        }
        return mapped;
      }

      var datasets = [
        { label: 'All Roles', raw: ANALYTICS.rejection_by_stage },
        { label: 'Excl. Intern', raw: ANALYTICS.rejection_by_stage_excl_intern },
        { label: 'Excl. Product & Tech', raw: ANALYTICS.rejection_by_stage_excl_product_tech }
      ];

      var html = insightBanner;

      var rejAnalysisHtml = '<table class="data-table"><thead><tr>' +
        '<th>Filter</th>' +
        '<th class="num">TA Screening</th>' +
        '<th class="num">Team Fit</th>' +
        '<th class="num">Technical</th>' +
        '<th class="num">Cultural</th>' +
        '<th class="num">Offer</th>' +
        '<th class="num">Total</th>' +
        '</tr></thead><tbody>';

      for (var di = 0; di < datasets.length; di++) {
        var ds = datasets[di];
        var m = normalizeRejections(ds.raw);
        var total = m['TA Screening'] + m['Team Fit'] + m['Technical'] + m['Cultural'] + m['Offer'];
        function rejCell(count, total) {
          if (count === 0) return '<td class="num zero">0</td>';
          var pct = total > 0 ? (count / total * 100).toFixed(1) : '0.0';
          return '<td class="num"><strong>' + count + '</strong><br><span style="font-size:11px;color:var(--text-dim)">' + pct + '%</span></td>';
        }
        rejAnalysisHtml += '<tr>' +
          '<td class="role-cell">' + ds.label + '</td>' +
          rejCell(m['TA Screening'], total) +
          rejCell(m['Team Fit'], total) +
          rejCell(m['Technical'], total) +
          rejCell(m['Cultural'], total) +
          rejCell(m['Offer'], total) +
          '<td class="num" style="font-weight:700">' + total + '</td>' +
          '</tr>';
      }
      rejAnalysisHtml += '</tbody></table>' +
        '<div class="funnel-banner" style="margin-top:20px">' +
        '<strong>Note:</strong> Application Review rejections excluded from above table. ' +
        'All roles: ' + (ANALYTICS.rejection_by_stage['Application Review'] || 0).toLocaleString() + ' &middot; ' +
        'Excl. Intern: ' + (ANALYTICS.rejection_by_stage_excl_intern['Application Review'] || 0).toLocaleString() + ' &middot; ' +
        'Excl. Product & Tech: ' + (ANALYTICS.rejection_by_stage_excl_product_tech['Application Review'] || 0).toLocaleString() +
        '</div>';
      html += collapsibleSection('Rejection Analysis by Stage', '(post-screening rejections only)', 'var(--accent)', rejAnalysisHtml);

      /* Funnel Efficiency per role */
      var funnel = ANALYTICS.funnel_efficiency || [];
      if (funnel.length > 0) {
        funnel.sort(function(a,b){ return b.screens_per_technical - a.screens_per_technical; });
        var funnelHtml = '<table class="data-table"><thead><tr>' +
          '<th>Role</th><th>Dept</th>' +
          '<th class="num">TA Screens</th>' +
          '<th class="num">Entered Team Fit</th>' +
          '<th class="num">Screens / Team Fit</th>' +
          '<th class="num">Entered Technical</th>' +
          '<th class="num">Screens / Technical</th>' +
          '<th class="num">TF &rarr; Tech %</th>' +
          '<th>Flags</th>' +
          '</tr></thead><tbody>';

        for (var fi = 0; fi < funnel.length; fi++) {
          var fe = funnel[fi];
          if (fe.ta_screens === 0) continue;
          var flags = [];
          if (fe.screens_per_teamfit > 5 && fe.ta_screens > 5) flags.push('<span class="issue-badge quality">TA &gt;5 per TF</span>');
          if (fe.screens_per_technical > 10 && fe.ta_screens > 5) flags.push('<span class="issue-badge risk">TA &gt;10 per Tech</span>');
          if (fe.tf_to_tech_pct < 30 && fe.team_fit_entered > 3) flags.push('<span class="issue-badge calibration">HM calibration</span>');
          var rowCls = flags.length > 0 ? ' class="row-flagged"' : '';
          var sptf = fe.screens_per_teamfit >= 999 ? '\u2014' : fe.screens_per_teamfit.toFixed(1);
          var sptech = fe.screens_per_technical >= 999 ? '\u2014' : fe.screens_per_technical.toFixed(1);
          funnelHtml += '<tr' + rowCls + '>' +
            '<td class="role-cell">' + escHtml(fe.name) + '</td>' +
            '<td class="dept-cell">' + escHtml(fe.dept) + '</td>' +
            numCell(fe.ta_screens) +
            numCell(fe.team_fit_entered) +
            '<td class="num"' + (fe.screens_per_teamfit > 5 && fe.ta_screens > 5 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + sptf + '</td>' +
            numCell(fe.technical_entered, fe.technical_entered > 0 ? 'highlight-post' : '') +
            '<td class="num"' + (fe.screens_per_technical > 10 && fe.ta_screens > 5 ? ' style="color:var(--red);font-weight:700"' : '') + '>' + sptech + '</td>' +
            '<td class="num"' + (fe.tf_to_tech_pct < 30 && fe.team_fit_entered > 3 ? ' style="color:var(--orange);font-weight:700"' : '') + '>' + (fe.team_fit_entered > 0 ? fe.tf_to_tech_pct + '%' : '\u2014') + '</td>' +
            '<td>' + flags.join(' ') + '</td>' +
            '</tr>';
        }
        funnelHtml += '</tbody></table>';
        html += collapsibleSection('Funnel Efficiency per Role', '(TA screens needed to advance candidates)', 'var(--orange)', funnelHtml);
      }

      /* Per-role rejection breakdown */
      var roleRej = ANALYTICS.per_role_rejections || [];
      if (roleRej.length > 0) {
        var roleRejHtml = '<table class="data-table"><thead><tr>' +
          '<th>Role</th><th>Dept</th>' +
          '<th class="num">TA Screen</th><th class="num">% of total</th>' +
          '<th class="num">Team Fit</th><th class="num">% of total</th>' +
          '<th class="num">Technical</th><th class="num">% of total</th>' +
          '<th class="num">Cultural</th><th class="num">Offer</th>' +
          '<th class="num">Total</th><th>Signal</th>' +
          '</tr></thead><tbody>';

        for (var rri = 0; rri < roleRej.length; rri++) {
          var rr = roleRej[rri];
          var taPct = rr.total > 0 ? Math.round(rr.ta_screening / rr.total * 100) : 0;
          var tfPct = rr.total > 0 ? Math.round(rr.team_fit / rr.total * 100) : 0;
          var techPct = rr.total > 0 ? Math.round(rr.technical / rr.total * 100) : 0;

          var signal = '';
          if (taPct > 80 && rr.ta_screening > 20) signal = '<span class="issue-badge quality">TA calibration</span>';
          else if (tfPct > 30 && rr.team_fit > 5) signal = '<span class="issue-badge calibration">Team Fit gatekeeper</span>';
          else if (techPct > 30 && rr.technical > 5) signal = '<span class="issue-badge risk">Tech drop-off</span>';
          else if (rr.offer > 0) signal = '<span class="issue-badge sustainability">Offer decline</span>';

          var rowCls = signal ? ' class="row-flagged"' : '';
          roleRejHtml += '<tr' + rowCls + '>' +
            '<td class="role-cell">' + escHtml(rr.name) + '</td>' +
            '<td class="dept-cell">' + escHtml(rr.dept) + '</td>' +
            numCell(rr.ta_screening) +
            '<td class="num" style="font-size:11px;color:var(--text-dim)">' + taPct + '%</td>' +
            numCell(rr.team_fit, tfPct > 30 && rr.team_fit > 5 ? 'highlight-cultural' : '') +
            '<td class="num" style="font-size:11px;color:var(--text-dim)">' + tfPct + '%</td>' +
            numCell(rr.technical, techPct > 30 && rr.technical > 5 ? 'highlight-post' : '') +
            '<td class="num" style="font-size:11px;color:var(--text-dim)">' + techPct + '%</td>' +
            numCell(rr.cultural) +
            numCell(rr.offer) +
            '<td class="num" style="font-weight:700">' + rr.total + '</td>' +
            '<td>' + signal + '</td>' +
            '</tr>';
        }
        roleRejHtml += '</tbody></table>';
        html += collapsibleSection('Per-Role Rejection Breakdown', '(post-review rejections by stage per role)', 'var(--red)', roleRejHtml);
      }

      /* Highest Impact Actions - auto-generated from data */
      var impactActions = [];
      // Action 1: Manager with highest delays
      var hiaMgrHF = ANALYTICS.manager_hireflix_review || [];
      hiaMgrHF.sort(function(a,b){ return b.delays - a.delays; });
      if (hiaMgrHF.length > 0 && hiaMgrHF[0].delays > 3) {
        var topMgr = hiaMgrHF[0];
        var mgrRoleNames = topMgr.roles.map(function(r){ return r.name; }).join(', ');
        impactActions.push({
          text: 'Reduce ' + escHtml(topMgr.manager) + ' Hireflix review time from ' + topMgr.avg_days + 'd to <3d \u2014 impacts ' + topMgr.total_candidates + ' candidates across ' + topMgr.roles.length + ' roles (' + mgrRoleNames + ')',
          type: 'stakeholder'
        });
      }
      // Action 2: Calibration roles
      var hiaFunnel = ANALYTICS.funnel_efficiency || [];
      var hiaCalib = hiaFunnel.filter(function(f){ return f.tf_to_tech_pct < 30 && f.team_fit_entered > 3; });
      if (hiaCalib.length > 0) {
        impactActions.push({
          text: 'Align with HMs on candidate profiles for ' + hiaCalib.length + ' roles with calibration issues (' + hiaCalib.slice(0,3).map(function(r){ return r.name; }).join(', ') + ') \u2014 Team Fit\u2192Technical rate is below 30%',
          type: 'calibration'
        });
      }
      // Action 3: Roles with high screening effort
      var hiaHighScreen = hiaFunnel.filter(function(f){ return f.screens_per_teamfit > 5 && f.ta_screens > 10; }).sort(function(a,b){ return b.screens_per_teamfit - a.screens_per_teamfit; });
      if (hiaHighScreen.length > 0) {
        var topHS = hiaHighScreen[0];
        impactActions.push({
          text: 'Improve sourcing quality for ' + escHtml(topHS.name) + ' \u2014 currently ' + topHS.screens_per_teamfit.toFixed(1) + ' screens per Team Fit entry (' + topHS.ta_screens + ' total screens)',
          type: 'quality'
        });
      }
      // Action 4: Second worst manager
      if (hiaMgrHF.length > 1 && hiaMgrHF[1].delays > 2) {
        var secMgr = hiaMgrHF[1];
        impactActions.push({
          text: 'Address ' + escHtml(secMgr.manager) + ' review delays (' + secMgr.avg_days + 'd avg, ' + secMgr.delays + ' delayed candidates) \u2014 ' + secMgr.roles.map(function(r){ return r.name; }).join(', '),
          type: 'stakeholder'
        });
      }
      // Action 5: Offer decline
      var hiaOD = ANALYTICS.offer_decline_2026 || {};
      if (hiaOD.declined > 2) {
        impactActions.push({
          text: 'Investigate offer decline causes (' + hiaOD.declined + ' declines at ' + hiaOD.decline_rate + '% rate) \u2014 roles affected: ' + (hiaOD.declined_roles || []).slice(0,3).map(function(r){ return escHtml(r); }).join(', '),
          type: 'risk'
        });
      }

      if (impactActions.length > 0) {
        var hiaHtml = '';
        for (var hiai = 0; hiai < Math.min(impactActions.length, 5); hiai++) {
          var hia = impactActions[hiai];
          hiaHtml += '<div style="margin-bottom:10px;padding:12px 18px;background:var(--white);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;display:flex;align-items:flex-start;gap:12px">' +
            '<span style="font-size:16px;font-weight:700;color:var(--accent);min-width:20px">' + (hiai + 1) + '</span>' +
            '<div><span class="issue-badge ' + hia.type + '">' + hia.type + '</span> ' +
            '<span style="font-size:13px">' + hia.text + '</span></div></div>';
        }
        html += collapsibleSection('Highest Impact Actions', '(top ' + Math.min(impactActions.length, 5) + ' recommendations)', 'var(--green)', hiaHtml);
      }

      document.getElementById('tab-effectiveness').innerHTML = html;
    }

    /* ================================================================
       TAB: OVERVIEW
       ================================================================ */
    function renderOverview() {

      var fullTimeJobs = jobs.filter(function(j){ return !/intern/i.test(j.name); });

        '<div class="kpi-card" style="border-left:4px solid var(--accent)"><div class="kpi-label">Avg TTF</div><div class="kpi-value">' + avgTTF + '<span style="font-size:18px">d</span></div></div>' +
        '<div class="kpi-card" style="border-left:4px solid var(--red)"><div class="kpi-label">At Risk / Unhealthy</div><div class="kpi-value" style="color:var(--red)">' + atRiskJobs.length + ' / ' + unhealthy.length + '</div></div>' +
        '</div>';

      html += '<div class="funnel-banner">' +
        '<strong>Pipeline Passthrough Rates:</strong> ' +
        'Screening &rarr; Team Fit: <strong>' + pt.screening_to_teamfit + '%</strong>' +
        '<span class="funnel-arrow"> | </span>' +
        'Team Fit &rarr; Technical: <strong>' + pt.teamfit_to_technical + '%</strong>' +
        '<span class="funnel-arrow"> | </span>' +
        'Technical &rarr; Cultural: <strong style="color:var(--red)">' + pt.technical_to_cultural + '%</strong>' +
        '<span class="funnel-arrow"> | </span>' +
        'Team Fit &rarr; Cultural: <strong style="color:var(--orange)">' + (pt.teamfit_to_cultural || 0) + '%</strong>' +

          attentionHtml += '<div class="empty-card" style="border-left:3px solid var(--red)"><div>' +
            '<div class="name">' + escHtml(u.name) + '</div>' +
            '<div class="meta">' + escHtml(u.dept) + ' &middot; ' + escHtml(u.recruiter) +
            ' &middot; <span class="issue-badge ' + u.issue + '">' + u.issue + '</span></div>' +
            '</div></div>';
        }
        attentionHtml += '</div>';
        html += collapsibleSection('Roles Needing Attention', '(' + unhealthy.length + ')', 'var(--red)', attentionHtml);
      }

      document.getElementById('tab-overview').innerHTML = html;
    }

    /* ===== WEEKLY OVERVIEW TAB ===== */
    function renderWeekly() {
      var roles = WEEKLY.roles || [];
      var lwLabel = WEEKLY.last_week_label || 'Last Week';
      var twLabel = WEEKLY.this_week_label || 'This Week';

      function fmt(n) { return n > 0 ? '<span style="font-weight:600">' + n + '</span>' : '<span style="color:#d1d5db">—</span>'; }
      function fmtPipe(n) { return n > 0 ? '<span style="color:#2563eb;font-weight:600">' + n + '</span>' : '<span style="color:#d1d5db">—</span>'; }
      function fmtRej(n) { return n > 0 ? '<span style="color:#ef4444;font-weight:600">' + n + '</span>' : '<span style="color:#d1d5db">—</span>'; }

      // Group by dept — merge Revenue into Sales
      var deptMap = {};
      var deptOrder = [];
      roles.forEach(function(r) {
        var dept = r.dept === 'Revenue' ? 'Sales' : r.dept;
        if (!deptMap[dept]) { deptMap[dept] = []; deptOrder.push(dept); }
        deptMap[dept].push(r);
      });
      deptOrder.sort();

      var html = '<div style="text-align:center;margin-bottom:24px">' +
        '<h2 style="font-size:20px;font-weight:700;color:#1a1a2e">📊 Weekly Pipeline Overview</h2>' +
        '<p style="font-size:13px;color:#6b7280;margin-top:4px">Pipeline = active candidates &nbsp;|&nbsp; ' +
        lwLabel + ' = rejected last week &nbsp;|&nbsp; ' + twLabel + ' = rejected this week</p></div>';

      deptOrder.forEach(function(dept) {
        var deptRoles = deptMap[dept];
        if (dept === 'Customer Support') {
          deptRoles.sort(function(a, b) {
            var aAgent = /agent/i.test(a.role) ? 0 : 1;
            var bAgent = /agent/i.test(b.role) ? 0 : 1;
            if (aAgent !== bAgent) return aAgent - bAgent;
            return a.role.localeCompare(b.role);
          });
        }
        if (dept === 'Sales') {
          var usKeywords = /north america|new york|usa|\bUS\b/i;
          deptRoles.sort(function(a, b) {
            var aUS = usKeywords.test(a.role) ? 1 : 0;
            var bUS = usKeywords.test(b.role) ? 1 : 0;
            if (aUS !== bUS) return aUS - bUS;
            return a.role.localeCompare(b.role);
          });
        }
        html += '<div style="margin-bottom:24px">';
        html += '<div style="font-size:14px;font-weight:700;color:#fff;background:#1a1a2e;padding:8px 16px;border-radius:8px 8px 0 0">' + dept + '</div>';

        deptRoles.forEach(function(r, idx) {
          var isLast = idx === deptRoles.length - 1;
          var borderRadius = isLast ? 'border-radius:0 0 8px 8px;' : '';
          html += '<div style="background:#fff;border:1px solid #e5e7eb;border-top:none;padding:16px 20px 12px;' + borderRadius + '">';
          html += '<div style="font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:2px">' + r.role + '</div>';
          html += '<div style="font-size:11px;color:#9ca3af;margin-bottom:8px">' + (r.recruiter || '') + '</div>';

          html += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
          html += '<tr><th style="text-align:left;font-weight:600;color:#6b7280;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:6px 12px;border-bottom:2px solid #e5e7eb">Stage</th>' +
            '<th style="text-align:right;font-weight:600;color:#6b7280;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:6px 12px;border-bottom:2px solid #e5e7eb">Pipeline</th>' +
            '<th style="text-align:right;font-weight:600;color:#6b7280;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:6px 12px;border-bottom:2px solid #e5e7eb">Last Wk Rejected</th>' +
            '<th style="text-align:right;font-weight:600;color:#6b7280;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:6px 12px;border-bottom:2px solid #e5e7eb">This Wk Rejected</th></tr>';

          (r.stages || []).forEach(function(s) {
            var isOffer = s.stage === 'Offer';
            var rowStyle = isOffer ? 'background:#f0fdf4;' : '';
            var stageStyle = isOffer ? 'font-weight:700;color:#16a34a;' : 'font-weight:500;color:#374151;';
            html += '<tr style="' + rowStyle + '">' +
              '<td style="padding:5px 12px;border-bottom:1px solid #f3f4f6;' + stageStyle + '">' + s.stage + '</td>' +
              '<td style="padding:5px 12px;border-bottom:1px solid #f3f4f6;text-align:right;font-variant-numeric:tabular-nums">' + fmtPipe(s.pipeline) + '</td>' +
              '<td style="padding:5px 12px;border-bottom:1px solid #f3f4f6;text-align:right;font-variant-numeric:tabular-nums">' + fmtRej(s.rej_lw) + '</td>' +
              '<td style="padding:5px 12px;border-bottom:1px solid #f3f4f6;text-align:right;font-variant-numeric:tabular-nums">' + fmtRej(s.rej_tw) + '</td></tr>';
          });

          // Total row
          html += '<tr style="border-top:2px solid #e5e7eb">' +
            '<td style="padding:5px 12px;font-weight:700;color:#1a1a2e">Total</td>' +
            '<td style="padding:5px 12px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">' + fmtPipe(r.total_pipeline) + '</td>' +
            '<td style="padding:5px 12px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">' + fmtRej(r.total_rej_lw) + '</td>' +
            '<td style="padding:5px 12px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">' + fmtRej(r.total_rej_tw) + '</td></tr>';

          html += '</table></div>';
        });

        html += '</div>';
      });

      /* ---- Candidates Needed in Technical ---- */
      if (EXEC && EXEC.roles) {
        html += '<div style="margin-top:40px;text-align:center"><h2 style="font-size:20px;font-weight:700;color:#1a1a2e">🎯 Candidates Needed in Technical to Fill</h2>';
        html += '<p style="font-size:13px;color:#6b7280;margin-top:4px">Based on actual historical data: how many candidates reached Technical for each offer made.</p></div>';

        html += '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:16px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)">';
        html += '<thead><tr style="background:#1a1a2e;color:#fff">';
        html += '<th style="padding:10px 12px;text-align:left">Role</th><th style="padding:10px 12px;text-align:left">Dept</th>';
        html += '<th style="padding:10px 8px;text-align:right">Pos</th><th style="padding:10px 8px;text-align:right">In Tech+</th>';
        html += '<th style="padding:10px 8px;text-align:right">Tech/Offer</th><th style="padding:10px 8px;text-align:right">Need</th>';
        html += '<th style="padding:10px 8px;text-align:right">Gap</th><th style="padding:10px 12px;text-align:center">Proximity</th>';
        html += '<th style="padding:10px 8px;text-align:right">Avg TA→Tech</th>';
        html += '</tr></thead><tbody>';

        var proxOrder = {'Offer stage':0,'Close':1,'On track':2,'Building':3,'Early':4};
        var execSorted = EXEC.roles.slice().sort(function(a, b) {
          if (a.tech_needed.has_data && !b.tech_needed.has_data) return -1;
          if (!a.tech_needed.has_data && b.tech_needed.has_data) return 1;
          if (a.tech_needed.has_data && b.tech_needed.has_data) {
            var pa = proxOrder[a.tech_needed.hire_proximity] ?? 5;
            var pb = proxOrder[b.tech_needed.hire_proximity] ?? 5;
            if (pa !== pb) return pa - pb;
          }
          return b.tech_needed.gap - a.tech_needed.gap;
        });
        execSorted.forEach(function(r, i) {
          var tn = r.tech_needed;
          var bg = i % 2 === 0 ? '#fff' : '#f9fafb';
          html += '<tr style="background:' + bg + '">';
          html += '<td style="padding:6px 12px;font-weight:600;color:#1a1a2e">' + r.name + '</td>';
          html += '<td style="padding:6px 12px;color:#6b7280">' + r.dept + '</td>';
          html += '<td style="padding:6px 8px;text-align:right">' + tn.positions + '</td>';
          html += '<td style="padding:6px 8px;text-align:right">' + tn.current + '</td>';
          if (tn.has_data) {
            var proxColors = {'Offer stage':'#16a34a','Close':'#0d9488','On track':'#2563eb','Building':'#d97706','Early':'#9ca3af'};
            var pc = proxColors[tn.hire_proximity] || '#9ca3af';
            html += '<td style="padding:6px 8px;text-align:right;color:#6b7280">' + tn.tech_per_offer + ':1</td>';
            html += '<td style="padding:6px 8px;text-align:right;font-weight:700">' + tn.needed + '</td>';
            html += '<td style="padding:6px 8px;text-align:right;font-weight:700;color:' + (tn.gap > 0 ? '#ef4444' : '#16a34a') + '">' + (tn.gap > 0 ? '+' + tn.gap : tn.gap) + '</td>';
            html += '<td style="padding:6px 12px;text-align:center;font-weight:600;color:' + pc + '">' + tn.hire_proximity + ' <span style="font-weight:400;opacity:.6">(' + tn.progress_pct + '%)</span></td>';
          } else {
            html += '<td style="padding:6px 8px;text-align:right;color:#d1d5db">—</td>';
            html += '<td style="padding:6px 8px;text-align:right">' + tn.entered_tech + '</td>';
            html += '<td style="padding:6px 8px;text-align:right;color:#d1d5db">—</td>';
            html += '<td style="padding:6px 12px;text-align:center;color:#9ca3af">No hire yet</td>';
          }
          // Avg TA → Tech timing
          var taDays = r.avg_ta_to_tech || 0;
          if (taDays > 0) {
            var taDayColor = taDays > 21 ? '#ef4444' : (taDays > 14 ? '#d97706' : '#16a34a');
            html += '<td style="padding:6px 8px;text-align:right;font-weight:600;color:' + taDayColor + '">' + taDays + 'd</td>';
          } else {
            html += '<td style="padding:6px 8px;text-align:right;color:#d1d5db">—</td>';
          }
          html += '</tr>';
        });
        html += '</tbody></table>';

        /* ---- Rejection Reasons by Stage per Role ---- */
        html += '<div style="margin-top:40px;text-align:center"><h2 style="font-size:20px;font-weight:700;color:#1a1a2e">📋 Rejection Reasons by Stage per Role</h2>';
        html += '<p style="font-size:13px;color:#6b7280;margin-top:4px">Only showing candidates who fit requirements or declined us. "Doesn\'t fit strong requirement" excluded.</p></div>';

        EXEC.roles.forEach(function(r) {
          var rr = r.rej_reasons || {};
          var rrStages = ['App Review','TA Screen','Team Fit','Technical','Cultural Fit','Offer'];
          var hasReasons = rrStages.some(function(s) { return rr[s] && rr[s].reasons.length > 0; });
          if (!hasReasons) return;

          html += '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px 20px;margin-top:12px">';
          html += '<div style="font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:2px">' + r.name + '</div>';
          html += '<div style="font-size:11px;color:#9ca3af;margin-bottom:10px">' + r.dept + '</div>';
          html += '<div style="display:flex;flex-wrap:wrap;gap:20px">';
          rrStages.forEach(function(stage) {
            if (!rr[stage] || !rr[stage].reasons.length) return;
            html += '<div style="min-width:170px;flex:1">';
            html += '<div style="font-size:12px;font-weight:600;color:#374151;margin-bottom:4px;border-bottom:1px solid #e5e7eb;padding-bottom:3px">' + stage + ' <span style="color:#9ca3af;font-weight:400">(' + rr[stage].total + ')</span></div>';
            rr[stage].reasons.forEach(function(item) {
              var short = item.reason.replace('Fits requirement, ','').replace('Fits most requirement, ','').replace('Declined us, ','').replace('Declined us - ','').replace('Declined by us ','').replace('Declined by us, ','');
              html += '<div style="font-size:11px;display:flex;justify-content:space-between;gap:6px;padding:2px 0">';
              html += '<span style="color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + item.reason + '">' + short + '</span>';
              html += '<span style="font-weight:600;white-space:nowrap">' + item.pct + '%</span>';
              html += '</div>';
            });
            html += '</div>';
          });
          html += '</div></div>';
        });
      }

      document.getElementById('tab-weekly').innerHTML = html;
    }

    /* Render all tabs */
    renderPipeline();
    renderRecruiter();
    renderDepartment();
    renderPerformance();
    renderEffectiveness();
    renderOverview();
    renderWeekly();
  </script>
</body>
</html>
